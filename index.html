<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>منصة التسويق بالعمولة</title>
<style>
body{margin:0;background:#f6f7fb}
</style>
</head>
<body>
<!-- جميع الحقوق محفوظة لصاحب المتجر — يُمنع إعادة رفع هذا الملف على أي استضافة أخرى دون إذن -->
<div dir="rtl" lang="ar" id="storeRoot">
  <header class="topbar">
    <div class="topbar-inner top-main">
      <div class="logo">منصة التسويق بالعمولة <span class="logo-dot">✦</span></div>
            <div class="top-actions">
        <div class="add-menu-wrap" id="addMenuWrap">
        <button id="addBtn" class="create-btn">➕ إضافة منتج ▾</button>
        <div id="addMenu" class="add-menu" hidden>
        <button id="addOneBtn">🔗 إضافة رابط منتج</button>
        <button id="addBulkBtn">📦 إضافة روابط منتجات دفعة واحدة</button>
        <button id="addSiteBtn">🏬 إضافة موقع متجر</button>
        </div>
        </div>
        <button id="shareBtn" class="create-btn">🌐 مشاركة</button>
        <button id="backupBtn" class="create-btn">💾 نسخة احتياطية</button>
        <button id="delAllBtn" class="create-btn del-all-btn">🗑 حذف الكل</button>
      </div>
    </div>
    <nav id="catNav" class="cats"></nav>
    <div class="topbar-inner top-filters">
      <div class="filters-row">
        <select id="sortSelect" aria-label="ترتيب">
        <option value="pop">الأكثر شعبية</option>
        <option value="new">الأحدث 🆕</option>
        <option value="cheap">السعر: من الأقل</option>
        <option value="exp">السعر: من الأعلى</option>
        <option value="rate">الأعلى تقييماً</option>
        </select>
        <select id="sizeSelect" aria-label="حجم العرض">
        <option value="s">حجم صغير</option>
        <option value="m">حجم متوسط</option>
        <option value="l">حجم كبير</option>
        </select>
        <select id="geoCountry" aria-label="الدولة"><option value="ALL">كل الدول</option></select>
        <select id="geoCity" aria-label="المدينة"><option value="ALL">كل المدن</option></select>
        <select id="geoCur" aria-label="العملة"><option value="ALL">كل العملات</option></select>
      </div>
      <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج… (سماعات، عطر، مصباح)" autocomplete="off" />
      <span class="search-ico">🔍</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div>
      <div class="hero-kicker">تصفح أفضل منتجات التسويق بالعمولة</div>
      <h2>كل ما تحتاجه، <span>في مكان واحد</span></h2>
      <div class="hero-btns">
        <button id="shopNowBtn" class="btn primary">تسوّق الآن</button>
        <button id="dealsBtn" class="btn ghost">عرض الخصومات</button>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="float f1">🎧</div>
      <div class="float f2">⌚</div>
      <div class="float f3">🕯️</div>
      <div class="float f4">👟</div>
    </div>
  </section>

  <main class="wrap">
    <div id="resultInfoEl" class="result-info"></div>
    <div id="productsGridEl" class="grid"></div>
  </main>

  <footer class="foot">
    <div>© منصة التسويق بالعمولة — الشراء يتم في مواقع البائعين الأصلية.</div>
    <div class="foot-sub">الأسعار استرشادية من المواقع الأصلية • الشراء يتم في موقع البائع • <span id="yearEl"></span></div>
  </footer>

  <div id="modalOverlay" class="overlay center" hidden>
    <div id="modalBox" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toastCtn" class="toasts"></div>
</div>

function geoWireEntry(cCtry,cCity,cCustom,cCur){
  var cs=document.getElementById(cCtry),ct=document.getElementById(cCity),ci=document.getElementById(cCustom),cu=document.getElementById(cCur);

  cs.onchange=function(){
    var code=cs.value;
    try{geoCityOptions(ct,code,"","غير محدد",true);}catch(e){}
    try{ct.disabled=!code;}catch(e){}
    try{if(ci){ci.hidden=true;ci.value="";}}catch(e){}

}

}

function nameFromSlug(url){
  try{
    var segs=new URL(url).pathname.split("/").filter(function(s){return !!s;});
    var stop=/^(dp|gp|product|products|p|item|ar|en|saudi-ar|saudi-en|uae-en|uae-ar|egypt-en|egypt-ar|men|women|kids|category|categories|collections?|catalogue|shop|store|listing|search)$/i;
    var cands=[];
    for(var i=0;i<segs.length;i++){
      var s=segs[i];
      try{s=decodeURIComponent(s);}catch(e){}
      if(stop.test(s))continue;
      if(/^[0-9]+$/.test(s))continue;
      if(s.length<4)continue;
      var nospace=s.replace(/[-_]/g,"");
      if(/^(N[0-9A-Z]+A?|[A-Z0-9]{8,})$/.test(nospace))continue;
      var words=s.split(/[-_]+/).filter(function(w){return w&&!/^[0-9]+$/.test(w)&&w.length>1;});
      if(words.length<2)continue;
      cands.push({words:words});
    }
    if(!cands.length)return "";
    cands.sort(function(a,b){return b.words.length-a.words.length;});
    var name=cands[0].words.slice(0,12).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(" ");
    return name.slice(0,140);
  }catch(e){return "";}
}

async function upscaleScanBlob(blob){

function scanCropRect(nx,ny,nw,nh){
  return new Promise(function(resolve,reject){
    var im=_scan.imgEl;
    if(!im||!im.naturalWidth){reject(new Error("noimg"));return;}
    var cw=new OffscreenCanvas(Math.max(1,Math.round(nw)),Math.max(1,Math.round(nh)));
    var cx2=cw.getContext("2d");
    try{
      var bmp=im;
      cx2.drawImage(bmp,nx,ny,nw,nh,0,0,cw.width,cw.height);
    }catch(e){reject(e);return;}
    try{
      cw.convertToBlob({type:"image/jpeg",quality:0.85}).then(function(blob){
        if(!blob){reject(new Error("blob"));return;}
        root.uploadPlugin(blob).then(function(up){
          if(up&&up.url)resolve(up.url);
          else reject(new Error("upload"));
        }).catch(reject);
      }).catch(reject);
    }catch(e){reject(e);}
  });
}
function scanMergeData(list){
  var m={name:"",price:0,cur:"",desc:""};
  var descs=[];
  for(var i=0;i<(list||[]).length;i++){
    var d=list[i];if(!d)continue;
    if(d.name&&d.name.length>(m.name||"").length)m.name=String(d.name).slice(0,140);
    if(!(m.price>0)&&d.price>0){m.price=Math.round(Number(d.price))||0;m.cur=d.cur||"";}
    if(d.desc&&descs.indexOf(d.desc)<0)descs.push(String(d.desc).slice(0,500));

async function scanCropBlob(blob,rx,ry,rw,rh){
  var bmp=await createImageBitmap(blob);
  try{
    var cw=Math.max(1,Math.round(rw)),ch=Math.max(1,Math.round(rh));
    var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
    var cx=cv.getContext("2d");cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
    cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);
    cx.drawImage(bmp,rx,ry,rw,rh,0,0,cw,ch);
    var out=await new Promise(function(res){try{cv.toBlob(function(b){res(b);},"image/jpeg",0.85);}catch(e){res(null);}});
    if(!out)throw new Error("crop");
    return out;
  }finally{try{bmp.close();}catch(e){}}
}
async function scanShotImage(shot){
  var bmp=await createImageBitmap(shot.blob);
  try{
    var nw=bmp.width||0,nh=bmp.height||0;
    if(!nw||!nh)throw new Error("noimg");
    var s=shot.sel;
    if(!(s&&s.dw>0&&s.dh>0))return null;
    var sx=nw/s.dw,sy=nh/s.dh;
    var cx0=Math.max(0,s.x*sx),cy0=Math.max(0,s.y*sy);
    var cw=s.w*sx,ch=s.h*sy;
    if(cx0+cw>nw)cw=nw-cx0;
    if(cy0+ch>nh)ch=nh-cy0;
    if(cw<2||ch<2)throw new Error("sel");
    var part=await scanCropBlob(shot.blob,cx0,cy0,cw,ch);
    return await scanUploadBlob(part);
  }finally{try{bmp.close();}catch(e){}}
}

function pickSrcsetUrl(s){
  s=(s||"").trim();if(!s)return "";
  var best="",bestV=-1;
  var parts=s.split(",");
  for(var i=0;i<parts.length;i++){
    var t=parts[i].trim().split(/\s+/);
    if(!t[0])continue;
    var v=i;var d=t[1]||"";
    if(/^\d+w$/i.test(d))v=parseInt(d,10);
    else if(/^\d+(\.\d+)?x$/i.test(d))v=parseFloat(d)*1000;
    if(v>=bestV){bestV=v;best=t[0];}
  }
  return best;
}

function extractAffQuery(aff){
  aff=(aff||"").trim();
  if(!aff)return "";
  var q="";
  if(/^https?:\/\//i.test(aff)){
    var qi=aff.indexOf("?");
    if(qi<0)return "";

  }else{
    q=aff.replace(/^[?&#]+/,"").split("#")[0];
  }
  q=(q||"").trim();
  if(!q)return "";
  if(q.indexOf("=")===-1&&q.indexOf("&")===-1)q="aff="+encodeURIComponent(q);
  return q;
}
function combineAffiliate(prod,aff){
  prod=(prod||"").trim();aff=(aff||"").trim();
  if(!prod)return "";

  var q=extractAffQuery(aff);
  if(!q)return prod;
  var parts=q.split("&").filter(function(x){return !!x;});
  var hash="";var hi=prod.indexOf("#");
  if(hi>=0){hash=prod.slice(hi);prod=prod.slice(0,hi);}
  var toAdd=[];
  for(var i=0;i<parts.length;i++){
    var key=parts[i].split("=")[0];
    if(key&&prod.indexOf(key+"=")!==-1)continue;
    toAdd.push(parts[i]);
  }
  if(!toAdd.length)return prod+hash;
  var sep=prod.indexOf("?")>=0?"&":"?";
  return prod+sep+toAdd.join("&")+hash;
}

function importBackupFile(f){

      customProducts=o.customProducts||[];saveCustom();

      deletedIds=o.deletedIds||{};saveDeleted();
      if(o.affMap)saveAffMap(o.affMap);
      if(o.affTag){try{localStorage.setItem(AFF_KEY,o.affTag);}catch(e){}}
      closeModal();renderProducts();scheduleSync();
      toast("تم استيراد النسخة ✅");

  rd.readAsText(f);

    _s={items:{},views:{},tombIds:[],fixedEdits:{},fixedDel:allFixed,updatedAt:0};_tombSet={};

    if(!confirm("حذف منتجاتك ("+had+") من السوق ومن جهازك؟\nمنتجات الآخرين ستبقى."))return;
    if(_sock&&_sockOk){

  }
}
